[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name            = "thinchat"
version         = "0.1.0"
description     = "A tiny, unified client for four LLM providers: openai, claude, gemini, ollama."
readme          = "README.md"
license         = "MIT"
license-files   = ["LICENSE"]
authors         = [{ name = "seokhoonj", email = "seokhoonj@gmail.com" }]
keywords        = ["llm", "openai", "claude", "gemini", "ollama", "completion", "embeddings"]
classifiers     = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
# 3.11+ for the typing niceties this package uses (e.g. Self).
requires-python = ">=3.11"
# The base install carries no provider SDK: each client imports its SDK lazily and is
# named as an extra, so a user installs only the provider they call.
dependencies    = []

[project.urls]
Homepage   = "https://github.com/seokhoonj/thinchat"
Repository = "https://github.com/seokhoonj/thinchat"
Issues     = "https://github.com/seokhoonj/thinchat/issues"

[project.optional-dependencies]
# openai, gemini, and ollama all speak the OpenAI-compatible API, so one SDK (`openai`)
# powers three providers; claude uses its own SDK. Each is imported lazily inside the
# client that needs it, so the extra pulls in only what its clients call. httpx is named
# directly in the stream error path (its transport errors are caught), so it is declared
# here rather than relied on transitively through the vendor SDK.
openai = ["openai>=1.30", "httpx>=0.23"]
claude = ["anthropic>=0.40", "httpx>=0.23"]
# Everything, for a caller that wants all four providers available.
all = ["openai>=1.30", "anthropic>=0.40", "httpx>=0.23"]
dev = [
    "openai>=1.30",
    "anthropic>=0.40",
    "httpx>=0.23",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/thinchat"]

[tool.ruff]
line-length    = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true

# The provider SDKs are optional extras, imported lazily and absent from a minimal
# environment, so mypy cannot see them -- and must not need to: the package type-checks
# without them.
[[tool.mypy.overrides]]
module = ["openai", "openai.*", "anthropic", "anthropic.*"]
ignore_missing_imports = true

# Tests get the real checks but not the annotation ceremony: `-> None` on every test
# function is noise, and a test's signature is never the thing under review.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
